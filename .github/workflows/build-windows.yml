name: Build ACA Platform Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter pillow certifi

      - name: Create Windows ICO from PNG
        shell: pwsh
        run: |
          python -c "from PIL import Image; img=Image.open('aca_platform_icon.png').convert('RGBA'); img.save('aca_platform_icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build single EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "ACA Platform" `
            --icon "aca_platform_icon.ico" `
            --collect-all customtkinter `
            --collect-data certifi `
            --add-data "aca_platform_icon.png;." `
            aca_platform.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\\ACA Platform.exe")) {
            throw "ACA Platform.exe was not created"
          }
          Get-Item "dist\\ACA Platform.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACA-Platform-5.15.5-Windows-x64
          path: dist/ACA Platform.exe
          if-no-files-found: error
